<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Diagnóstico temporal FIG.0 — se borra tras verificar</title>
<style>
body{background:#05080a;color:#cfe3dc;font:14px/1.45 monospace;margin:0;padding:12px}
iframe{width:100%;height:640px;border:1px solid #1d3a2f;background:#05080a}
pre{white-space:pre-wrap;word-break:break-word;margin:12px 0}
</style>
</head>
<body>
<p><b>Diagnóstico temporal de FIG.0</b> — esta página se borra tras verificar. Muestrea la geometría real de Hero C dentro de la vista previa cada segundo durante 15 s.</p>
<iframe id="f" src="/"></iframe>
<pre id="out">Cargando la vista previa…</pre>
<script>
(function(){
  var out=document.getElementById('out');
  var f=document.getElementById('f');
  var n=0;
  function rnd(v){ return Math.round(v); }
  function pickSvg15(hero){
    var svgs=hero.querySelectorAll('svg');
    if(!svgs||!svgs.length) return {svg:null,idx:-1,why:'sin svg'};
    var k,m,ts;
    for(k=0;k<svgs.length;k++){ ts=svgs[k].querySelectorAll('text'); for(m=0;m<ts.length;m++){ if((ts[m].textContent||'').trim()==='Human review') return {svg:svgs[k],idx:k,why:'Human review'}; } }
    for(k=0;k<svgs.length;k++){ if(svgs[k].querySelector('text')) return {svg:svgs[k],idx:k,why:'primer svg con texto'}; }
    return {svg:svgs[0],idx:0,why:'primer svg'};
  }
  function contentBottom15(svg){
    var maxB=null; var ts,i,t,b,bot,par,gb,seen=[];
    try{ ts=svg.querySelectorAll('text'); }catch(e){ return {cb:null,seen:seen}; }
    for(i=0;i<ts.length;i++){
      t=ts[i];
      try{
        if(!t.getClientRects||!t.getClientRects().length) continue;
        b=t.getBBox();
      }catch(e2){ continue; }
      if(!b||!(b.height>0)||!isFinite(b.y)||!isFinite(b.height)) continue;
      bot=b.y+b.height;
      seen.push((t.textContent||'').trim().slice(0,18)+'='+rnd(bot));
      par=t.parentElement;
      if(par&&par!==svg&&par.getBBox){
        try{
          gb=par.getBBox();
          if(gb&&gb.height>0&&gb.height<=220&&isFinite(gb.y)&&isFinite(gb.height)){
            if(gb.y+gb.height>bot) bot=gb.y+gb.height;
          }
        }catch(e3){}
      }
      if(maxB===null||bot>maxB) maxB=bot;
    }
    return {cb:maxB,seen:seen};
  }
  function sample(){
    n++;
    var L=[];
    L.push('--- pasada '+n+' '+new Date().toLocaleTimeString()+' ---');
    var d;
    try{
      d=f.contentDocument;
      if(!d) throw new Error('sin acceso al iframe');
      var W=d.defaultView;
      L.push('iter15 cargado (__i15)='+(W&&W.__i15?'si':'NO'));
      var hero=d.querySelector('section[data-screen-label="Hero C"]');
      if(!hero){ L.push('Hero C: NO ENCONTRADO'); }
      else{
        var svgs=hero.querySelectorAll('svg');
        L.push('svg en Hero C: '+svgs.length);
        for(var i=0;i<svgs.length;i++){
          var s=svgs[i]; var r=s.getBoundingClientRect(); var cs=W.getComputedStyle(s);
          var texts=s.querySelectorAll('text').length;
          var hr=false; var t2=s.querySelectorAll('text');
          for(var j=0;j<t2.length;j++){ if((t2[j].textContent||'').trim()==='Human review'){hr=true;break;} }
          var par=s.parentElement;
          var pr=par?par.getBoundingClientRect():{width:0,height:0};
          L.push(' svg['+i+'] viewBox='+(s.getAttribute('viewBox')||'(ninguno)')+' rect='+rnd(r.width)+'x'+rnd(r.height)+' display='+cs.display+' vis='+cs.visibility+' op='+cs.opacity+' texts='+texts+' humanReview='+hr+' padre='+(par?par.tagName+'.'+(par.className||''): '?')+' padreRectH='+rnd(pr.height)+' padreInlineH='+(par?(par.style.height||'(ninguno)'):'?'));
        }
        var pick=pickSvg15(hero);
        var svg=pick.svg;
        L.push(' pickSvg15 -> svg['+pick.idx+'] ('+pick.why+')');
        if(svg){
          var wrap=svg.parentElement, fig=wrap?wrap.parentElement:null;
          var wr=wrap.getBoundingClientRect();
          var sr=svg.getBoundingClientRect();
          var cb=contentBottom15(svg);
          var vbW=(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.width)||1000;
          var scale=sr.width/vbW;
          var targetH=sr.height;
          if(cb.cb!==null&&isFinite(cb.cb)&&scale>0) targetH=(cb.cb+10)*scale;
          L.push(' wrap: rectH='+rnd(wr.height)+' clientH='+wrap.clientHeight+' inlineH='+(wrap.style.height||'(ninguna)')+' inlineOverflowY='+(wrap.style.overflowY||'(ninguna)')+' hijos='+wrap.children.length+' svgRect='+rnd(sr.width)+'x'+rnd(sr.height)+' svgTopRelWrap='+rnd(sr.top-wr.top));
          L.push(' contentBottom15='+cb.cb+' textosVisibles=['+cb.seen.join(', ')+'] scale='+scale.toFixed(2)+' targetH='+rnd(targetH)+' excess='+(rnd(wr.height)-rnd(targetH+24)));
          var root=null; try{ root=svg.getBBox(); }catch(e){}
          L.push(' svg getBBox='+(root?('x='+root.x.toFixed(0)+' y='+root.y.toFixed(0)+' w='+root.width.toFixed(0)+' h='+root.height.toFixed(0)+' bottom='+(root.y+root.height).toFixed(0)):'ERROR'));
          if(fig){
            var fr=fig.getBoundingClientRect();
            var grid=null;
            var btns=hero.querySelectorAll('button');
            for(var bb=0;bb<btns.length;bb++){ var t3=(btns[bb].textContent||'').trim(); if(/^propos/i.test(t3)){ var col=btns[bb].parentElement; if(col&&col.parentElement&&col.parentElement.parentElement===fig) grid=col.parentElement; break; } }
            if(!grid){ var kids=fig.children; for(var k2=0;k2<kids.length;k2++){ if(kids[k2]!==wrap){ grid=kids[k2]; break; } } }
            L.push(' fig: rectH='+rnd(fr.height)+' grid='+(grid?('topRelWrap='+(rnd(grid.getBoundingClientRect().top-wr.bottom))+' marginTopInline='+(grid.style.marginTop||'(ninguno)')):'NO'));
          }
        }
      }
      var cue=d.getElementById('constellation-cue');
      L.push(' cue: '+(cue?('i15-hide='+cue.classList.contains('i15-cue-hide')+' i11-hide='+cue.classList.contains('i11-cue-hide')):'no existe'));
    }catch(err){ L.push('ERROR: '+err.message); }
    out.textContent+=(out.textContent===''?'':'\n')+L.join('\n')+'\n';
    if(n<15) setTimeout(sample,1000);
  }
  f.addEventListener('load',function(){ setTimeout(sample,1500); });
})();
</script>
</body>
</html>
