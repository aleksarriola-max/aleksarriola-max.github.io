<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba 390px - Iteracion 11 (temporal)</title>
<style>body{background:#0D1210;color:#E5EAE4;font:13px/1.5 monospace;margin:0;padding:10px}h1{font-size:14px;color:#D9B36A}button{background:#1A2B22;color:#E5EAE4;border:1px solid #92AC9B;padding:8px 10px;margin:3px 3px 3px 0;cursor:pointer}iframe{width:390px;height:844px;border:2px solid #D9B36A;background:#0D1210;display:block;margin-top:8px}pre{white-space:pre-wrap;background:#111A15;border:1px solid #2A3B32;padding:10px;max-height:320px;overflow:auto}</style></head>
<body>
<h1>PRUEBA 390px - ITERACION 11 - TEMPORAL (se elimina en la limpieza)</h1>
<p>El iframe apunta al dominio de la rama (codigo actual), no a una ruta relativa. Ancho del iframe: 390px.</p>
<div>
<button id="b-mapa">Medir mapa - ORCEN KIT</button>
<button id="b-kpi">Medir KPI4 (WACC-GROWTH)</button>
<button id="b-cue">Medir aviso inferior</button>
<button id="b-grid">Medir rejilla (titulo tras clic)</button>
<button id="b-verd">Medir veredicto</button>
<button id="b-peor">Peor caso KPI4: 10.5% - 5.0%</button>
<button id="b-base">Modelo base 8.5% - 4.0%</button>
<button id="b-todo">Medir todo</button>
</div>
<pre id="probe">Cargando el iframe…</pre>
<iframe id="f" src="https://aleks-portfolio-redesign-git-redesign-terminal-20-21be50-aleks9.vercel.app/#home" title="Portafolio en la rama"></iframe>
<script>
var BR='https://aleks-portfolio-redesign-git-redesign-terminal-20-21be50-aleks9.vercel.app';
var P=document.getElementById('probe');
function out(s){P.textContent+=(P.textContent?'\n':'')+s;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)});}
function W(){return document.getElementById('f').contentWindow;}
function D(){return document.getElementById('f').contentDocument;}
function rr(el){var b=el.getBoundingClientRect();return '[l'+Math.round(b.left)+' t'+Math.round(b.top)+' r'+Math.round(b.right)+' b'+Math.round(b.bottom)+' w'+Math.round(b.width)+' h'+Math.round(b.height)+']';}
function ov(a,b){return a.left<b.right-2&&a.right>b.left+2&&a.top<b.bottom-2&&a.bottom>b.top+2;}
async function medirMapa(){
 try{
  var d=D(),w=W();var chart=d.querySelector('.cm-chart');if(!chart){out('MAPA: no hay .cm-chart');return;}
  var nodes=[].slice.call(d.querySelectorAll('.cm-node')).map(function(n){return (n.getAttribute('data-key')||'?')+':'+(n.querySelector('.cm-label')?n.querySelector('.cm-label').textContent.trim():'');});
  out('MAPA nodos: '+nodes.join(' | '));
  chart.scrollIntoView({block:'center'});await sleep(500);
  var node=d.querySelector('.cm-node[data-key="p4"]');if(!node){out('MAPA: no hay nodo p4 (ORCEN KIT)');return;}
  node.scrollIntoView({block:'center'});await sleep(300);
  try{node.focus();}catch(e){}
  ['pointerover','mouseover','touchstart'].forEach(function(t){try{node.dispatchEvent(new w.Event(t,{bubbles:true,cancelable:true}));}catch(e){}});
  await sleep(1100);
  var desc=node.querySelector('.cm-desc');if(!desc){out('MAPA ORCEN: sin .cm-desc');return;}
  var cs=w.getComputedStyle(desc);var dr=desc.getBoundingClientRect(),cr=chart.getBoundingClientRect();
  var hits=[].slice.call(d.querySelectorAll('.cm-label')).filter(function(l){return ov(dr,l.getBoundingClientRect());}).map(function(l){return l.textContent.trim().slice(0,22);});
  var dentro=dr.left>=cr.left-1&&dr.right<=cr.right+1&&dr.top>=cr.top-1&&dr.bottom<=cr.bottom+1;
  out('MAPA ORCEN KIT p4: desc="'+(desc.textContent||'').trim().slice(0,60)+'" display="'+desc.style.display+'" opacity='+cs.opacity+' rect='+rr(desc)+' chart='+rr(chart)+' dentroDelChart='+dentro+' solapaEtiquetas='+(hits.length?hits.join(' | '):'ninguna'));
 }catch(e){out('MAPA ERROR: '+e.message);}
}
async function medirKpi(){
 try{
  var d=D(),w=W();var sec=d.querySelector('.i5-build');if(!sec){out('KPI4: no hay .i5-build');return;}
  sec.scrollIntoView({block:'center'});await sleep(400);
  var kpi=sec.querySelector('[data-i5="kpi4"]');var span=kpi.querySelector('span');var cs=w.getComputedStyle(span);
  var nRects=span.getClientRects().length;
  out('KPI4: texto="'+span.textContent.trim()+'" font='+cs.fontSize+' whiteSpace='+cs.whiteSpace+' rects='+nRects+' unaLinea='+(nRects===1)+' span='+rr(span)+' caja='+rr(kpi)+' desbordaDer='+(span.getBoundingClientRect().right>kpi.getBoundingClientRect().right+1)+' modeloGuardado='+(w.localStorage.getItem('i6-model')||'ninguno'));
 }catch(e){out('KPI4 ERROR: '+e.message);}
}
async function medirCue(){
 try{
  var d=D(),w=W();var cue=d.getElementById('constellation-cue');if(!cue){out('AVISO: no hay #constellation-cue');return;}
  var r=cue.getBoundingClientRect();
  out('AVISO: texto="'+(cue.textContent||'').trim().slice(0,60)+'" rect='+rr(cue)+' anchoIframe='+w.innerWidth+' huecoDerecho='+(Math.round(w.innerWidth-r.right))+'px opacity='+w.getComputedStyle(cue).opacity);
 }catch(e){out('AVISO ERROR: '+e.message);}
}
async function medirGrid(){
 try{
  var d=D(),w=W();var sec=d.querySelector('.i5-build');if(!sec){out('REJILLA: no hay .i5-build');return;}
  sec.scrollIntoView({block:'center'});await sleep(400);
  var grid=sec.querySelector('.i5-grid');var cells=[].slice.call(grid.children).filter(function(c){return /^\s*\$?\d+(\.\d+)?\s*$/.test(c.textContent||'');});
  var cell=cells[4]||cells[0];if(!cell){out('REJILLA: sin celdas de valor');return;}
  cell.dispatchEvent(new w.Event('pointerover',{bubbles:true,cancelable:true}));await sleep(250);
  var tAntes=cell.title;
  cell.click();await sleep(700);
  var tDespues=cell.title;
  out('REJILLA: celda="'+cell.textContent.trim()+'" tituloTrasHover="'+tAntes+'" tituloTrasClicSinHover="'+tDespues+'" iguales='+(tAntes===tDespues)+' modelo='+JSON.stringify(w.__i6Model||null));
  await sleep(2500);
  var v=sec.querySelector('[data-i5="verdict"]');
  out('REJILLA tras rebuild: kpi1="'+(sec.querySelector('[data-i5="kpi1"] span')||{textContent:''}).textContent.trim()+'" kpi3="'+(sec.querySelector('[data-i5="kpi3"] span')||{textContent:''}).textContent.trim()+'" veredicto="'+(v?v.textContent.trim():'')+'" log="'+(sec.querySelector('.i5-log')||{textContent:''}).textContent.trim()+'"');
 }catch(e){out('REJILLA ERROR: '+e.message);}
}
async function medirVerdict(){
 try{
  var d=D();var sec=d.querySelector('.i5-build');if(!sec){out('VEREDICTO: no hay .i5-build');return;}
  var v=sec.querySelector('[data-i5="verdict"]');
  out('VEREDICTO: kpi1="'+(sec.querySelector('[data-i5="kpi1"] span')||{textContent:''}).textContent.trim()+'" kpi3="'+(sec.querySelector('[data-i5="kpi3"] span')||{textContent:''}).textContent.trim()+'" kpi4="'+(sec.querySelector('[data-i5="kpi4"] span')||{textContent:''}).textContent.trim()+'" veredicto="'+(v?v.textContent.trim():'')+'" log="'+(sec.querySelector('.i5-log')||{textContent:''}).textContent.trim()+'"');
 }catch(e){out('VEREDICTO ERROR: '+e.message);}
}
function recargar(){document.getElementById('f').src=BR+'/#home';}
async function medirTodo(){await medirKpi();await medirCue();await medirMapa();await medirVerdict();out('FIN mediciones');}
document.getElementById('b-mapa').onclick=medirMapa;
document.getElementById('b-kpi').onclick=medirKpi;
document.getElementById('b-cue').onclick=medirCue;
document.getElementById('b-grid').onclick=medirGrid;
document.getElementById('b-verd').onclick=medirVerdict;
document.getElementById('b-todo').onclick=medirTodo;
document.getElementById('b-peor').onclick=function(){try{W().localStorage.setItem('i6-model',JSON.stringify({w:10.5,g:5}));}catch(e){} recargar();};
document.getElementById('b-base').onclick=function(){try{W().localStorage.setItem('i6-model',JSON.stringify({w:8.5,g:4}));}catch(e){} recargar();};
document.getElementById('f').addEventListener('load',function(){setTimeout(medirTodo,1500);});
</script>
</body></html>
