<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba 390px (temporal)</title>
<style>
body{margin:0;background:#333;color:#fff;font:14px/1.5 system-ui}
.bar{padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar button{padding:6px 12px;font:inherit;cursor:pointer}
.wrap{display:flex;justify-content:center;padding-bottom:20px}
iframe{display:block;width:390px;height:844px;border:3px solid #888;background:#fff}
</style>
</head>
<body>
<div class="bar"><strong>Prueba 390px (temporal, solo para verificar el móvil)</strong><button data-u="/">Home</button><button data-u="/#finance">Finance</button><span id="st">cargando…</span></div>
<div class="wrap"><iframe id="f" src="/"></iframe></div>
<script>
var f=document.getElementById('f'),st=document.getElementById('st');
function show(){try{st.textContent='iframe: '+f.contentWindow.location.pathname+f.contentWindow.location.hash+' · ancho '+f.contentWindow.innerWidth+'px';}catch(e){st.textContent='iframe cargado (origen distinto)';}}
f.addEventListener('load',show);
document.querySelectorAll('button[data-u]').forEach(function(b){b.addEventListener('click',function(){f.src=b.getAttribute('data-u');});});
</script>
</body>
</html>
