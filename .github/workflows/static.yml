# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Also deploy after the daily essay job commits a new post.
  # (Commits made with GITHUB_TOKEN do NOT fire the push trigger above,
  # so this workflow_run trigger is what keeps the live site in sync.)
  workflow_run:
    workflows: ["Publish Daily Essay"]
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; newest commit wins (see cancel-in-progress below).
concurrency:
  group: "pages"
  # Site should always reflect the latest commit; if deploys are slow and
  # stack up, cancel the superseded in-progress one so they don't jam the
  # Pages environment in a "waiting" state.
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # When triggered by the daily essay run, only deploy if that run succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prune non-site files from the Pages artifact
        run: |
          # Session logs, audit data, local config and credentials are not
          # part of the website. Removing them shrinks the deploy artifact
          # from ~11MB to under 1MB (fixes the Pages deploy timeout) and
          # keeps them off the public site.
          rm -f *.jsonl .audit-key .last-cleanup .lock 1.json || true
          rm -f .credentials.json .claude.json .claude.json.backup.* || true
          rm -f essay_state.json || true
          echo "Artifact size:"; du -sh --exclude=.git .
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub Pages backend can be slow/degraded; wait up to 30 min
          # (default is 10 min) so a slow-but-working deploy still succeeds
          # instead of being killed mid-publish.
          timeout: 1800000
